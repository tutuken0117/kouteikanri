<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工事工程管理表</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   工事工程管理表  /  construction schedule management
   ・休日／検査期間／工程バーはSVG描画（印刷の「背景のグラフィック」OFFでも色が出る）
   ============================================================ */
:root{
  --f-disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-sheet:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --note-fs:9px;
  --f-mono:"IBM Plex Mono","Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --c-stage:#DCE1E8;
  --c-paper:#FFFFFF;
  --c-paper-2:#F6F8FB;
  --c-edge:#C3CBD6;
  --c-line:#E3E8EF;
  --c-line-mid:#C8D1DD;
  --c-line-strong:#93A0B2;
  --c-text:#18212D;
  --c-text-2:#57657A;
  --c-text-3:#8A97A8;
  --c-field:#F2F5F9;
  --c-field-focus:#FFFFFF;
  --c-accent:#1D4E7C;
  --c-accent-2:#3D7BB0;
  --c-accent-soft:#E6EEF7;
  --c-sat:#2F6F8F;
  --c-sun:#B4433F;
  --c-sat-a:.12;
  --c-sun-a:.12;
  --c-satw-a:.055;
  --c-insp:#B8862B;
  --c-bar:#111820;
  --c-plan:#111820;
  --c-actual:#C1272D;
  --c-band:#3D7BB0;
  --c-chrome:#131A23;
  --c-chrome-t:#E9EEF4;
  --c-chrome-2:#95A3B4;
  --c-chrome-line:#2A3542;
  --c-chrome-hi:#1E2833;
  --c-shadow:rgba(21,32,45,.18);

  --leftw:252px;
  --rowh:36px;
  --cw:10px;
  --h-month:22px;
  --h-day:18px;
  --h-dow:16px;
  --curveh:150px;
  --mrowh:17px;
  --mheadh:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-stage:#0C1116;--c-paper:#171E27;--c-paper-2:#1C242E;--c-edge:#000;
    --c-line:#2A3341;--c-line-mid:#3A4657;--c-line-strong:#6E7C8F;
    --c-text:#DFE6EF;--c-text-2:#A3B0C0;--c-text-3:#7C8899;
    --c-field:#212A35;--c-field-focus:#26313E;
    --c-accent:#79B0E2;--c-accent-2:#9AC6ED;--c-accent-soft:#1F2C3A;
    --c-sat:#60A8CD;--c-sun:#E06E66;--c-sat-a:.17;--c-sun-a:.17;--c-satw-a:.08;--c-insp:#D5A94A;
    --c-bar:#CBD5E0;--c-plan:#CBD5E0;--c-actual:#F0705F;--c-band:#6FA6D8;
    --c-chrome:#0F151B;--c-chrome-line:#232D39;--c-chrome-hi:#1A232D;
    --c-shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-stage:#0C1116;--c-paper:#171E27;--c-paper-2:#1C242E;--c-edge:#000;
  --c-line:#2A3341;--c-line-mid:#3A4657;--c-line-strong:#6E7C8F;
  --c-text:#DFE6EF;--c-text-2:#A3B0C0;--c-text-3:#7C8899;
  --c-field:#212A35;--c-field-focus:#26313E;
  --c-accent:#79B0E2;--c-accent-2:#9AC6ED;--c-accent-soft:#1F2C3A;
  --c-sat:#60A8CD;--c-sun:#E06E66;--c-sat-a:.17;--c-sun-a:.17;--c-satw-a:.08;--c-insp:#D5A94A;
  --c-bar:#CBD5E0;--c-plan:#CBD5E0;--c-actual:#F0705F;--c-band:#6FA6D8;
  --c-chrome:#0F151B;--c-chrome-line:#232D39;--c-chrome-hi:#1A232D;
  --c-shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--c-stage);color:var(--c-text);font-family:var(--f-body);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-accent-2);outline-offset:1px}

/* ---------- chrome ---------- */
.chrome{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;
  background:var(--c-chrome);color:var(--c-chrome-t);border-bottom:1px solid var(--c-chrome-line);box-shadow:0 1px 12px rgba(0,0,0,.22)}
.brand{display:flex;align-items:baseline;gap:9px;padding-right:6px;border-right:1px solid var(--c-chrome-line)}
.brand b{font-family:var(--f-disp);font-weight:900;font-size:15px;letter-spacing:.06em}
.brand span{font-size:10px;letter-spacing:.22em;color:var(--c-chrome-2);font-family:var(--f-mono)}
.grp{display:flex;align-items:center;gap:6px}
.grp+.grp{padding-left:11px;border-left:1px solid var(--c-chrome-line)}
.grp>label{font-size:10.5px;letter-spacing:.1em;color:var(--c-chrome-2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:3px;background:var(--c-chrome-hi);
  border:1px solid var(--c-chrome-line);color:var(--c-chrome-t);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease}
.btn:hover{background:#26313E;border-color:#3A4756}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:var(--c-chrome-hi);border-color:var(--c-chrome-line)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--c-accent-2);border-color:var(--c-accent-2);color:#0B121A;font-weight:700}
.btn.on.act{background:#D8624A;border-color:#D8624A;color:#fff}
.btn.primary{background:#B9532E;border-color:#C96B45;color:#fff;font-weight:700;letter-spacing:.03em}
.btn.primary:hover{background:#C96038}
.btn.ghost{background:transparent}
.seg{display:flex;border:1px solid var(--c-chrome-line);border-radius:3px;overflow:hidden}
.seg .btn{border:0;border-radius:0;background:transparent;padding:6px 10px}
.chrome input[type=range]{width:96px;accent-color:var(--c-accent-2)}
.chrome .num{width:42px;background:var(--c-chrome-hi);border:1px solid var(--c-chrome-line);border-radius:3px;padding:4px 5px;
  font-family:var(--f-mono);font-size:11.5px;text-align:right}
.spacer{flex:1 1 auto}
.hint{font-size:11px;color:var(--c-chrome-2);font-family:var(--f-mono)}

/* ---------- stage & sheet ---------- */
.stage{padding:18px 18px 110px;display:flex;justify-content:center;overflow:auto}
.sheet{font-family:var(--f-sheet);background:var(--c-paper);border:1px solid var(--c-edge);box-shadow:0 10px 34px -12px var(--c-shadow);
  width:100%;max-width:1600px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:9px}
.sheet-head{border-bottom:2px solid var(--c-text);padding-bottom:6px}
.sheet-head h1{margin:0;font-family:var(--f-disp);font-weight:900;font-size:21px;letter-spacing:.16em}
.sheet-head .doc-meta{text-align:right;font-family:var(--f-mono);font-size:10.5px;color:var(--c-text-2);line-height:1.6}

.info{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1fr) auto;border:1px solid var(--c-line-mid)}
.info .fld{display:flex;align-items:stretch;border-right:1px solid var(--c-line-mid);min-width:0}
.info .fld:last-child{border-right:0}
.info .fld>.lb{flex:0 0 auto;display:flex;align-items:center;padding:0 9px;background:var(--c-paper-2);border-right:1px solid var(--c-line-mid);
  font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--c-text-2);white-space:nowrap}
.info .fld>.vl{flex:1 1 auto;display:flex;align-items:center;gap:5px;padding:4px 8px;min-width:0}
.inp{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px dotted transparent;padding:2px 1px;font-size:13px}
.inp:hover{border-bottom-color:var(--c-line-mid)}
.inp:focus{outline:0;background:var(--c-field-focus);border-bottom-color:var(--c-accent)}
.inp.big{font-size:15px;font-weight:700;font-family:var(--f-disp)}
.inp.date{font-family:var(--f-mono);font-size:12px;width:auto;flex:0 1 auto}
.inp.n{width:34px;flex:0 0 auto;text-align:right;font-family:var(--f-mono);font-size:12px;border-bottom:1px dotted var(--c-line-mid)}
.inp.n::-webkit-outer-spin-button,.inp.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dash,.unit{color:var(--c-text-3);font-size:11px;white-space:nowrap}
.days-badge{font-family:var(--f-mono);font-size:10.5px;color:var(--c-text-2);background:var(--c-field);border:1px solid var(--c-line);
  border-radius:2px;padding:1px 5px;white-space:nowrap}
.pv{display:none;min-width:0;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.pv.big{font-family:var(--f-disp);font-weight:700;font-size:15px}
.pv.date{font-family:var(--f-mono);font-size:12px;white-space:nowrap}

/* ---------- board ---------- */
.board{border:1px solid var(--c-line-strong);overflow:auto;position:relative;background:var(--c-paper)}
.binner{display:grid;grid-template-columns:var(--leftw) max-content;width:max-content}
.q00{position:sticky;top:0;left:0;z-index:6;background:var(--c-paper-2);border-right:1px solid var(--c-line-strong)}
.q01{position:sticky;top:0;z-index:5;background:var(--c-paper)}
.q10{position:sticky;left:0;z-index:4;background:var(--c-paper);border-right:1px solid var(--c-line-strong)}
.q11{position:relative;z-index:1}
.tlmain{position:relative}
.hlayer{position:relative;z-index:1;height:100%}

.lh{height:calc(var(--h-month) + var(--h-day) + var(--h-dow));display:flex;align-items:flex-end;gap:6px;padding:0 8px 4px;
  border-bottom:1px solid var(--c-line-strong)}
.lh .t1{flex:1 1 auto;font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.2em}
.lh .t2{flex:0 0 auto;font-size:10px;letter-spacing:.1em;color:var(--c-text-2);width:52px;text-align:center}

.lrow{height:var(--rowh);display:flex;align-items:center;gap:5px;padding:0 6px 0 3px;border-bottom:1px solid var(--c-line);background:var(--c-paper)}
.lrow:hover{background:var(--c-paper-2)}
.lrow.sel{background:var(--c-accent-soft)}
.lrow.drag{opacity:.4}
.grip{flex:0 0 auto;width:13px;height:100%;cursor:grab;display:flex;align-items:center;justify-content:center;color:var(--c-text-3);font-size:11px;user-select:none}
.grip:active{cursor:grabbing}
.grip,.track{touch-action:none}
@media (hover:none){.xbtn{opacity:1}}
.swatch{flex:0 0 auto;width:13px;height:13px;border:0;background:none;padding:0;cursor:pointer;line-height:0}
.rname{flex:1 1 auto;min-width:0;font-size:12px;background:transparent;border:0;padding:2px 3px;border-radius:2px}
.rname:focus{outline:0;background:var(--c-field-focus);box-shadow:inset 0 0 0 1px var(--c-accent)}
.rwt{flex:0 0 auto;width:44px;text-align:right;font-family:var(--f-mono);font-size:11.5px;background:transparent;border:0;
  border-bottom:1px dotted var(--c-line-mid);padding:1px 3px;-moz-appearance:textfield}
.rwt:focus{outline:0;background:var(--c-field-focus);border-bottom-color:var(--c-accent)}
.rwt::-webkit-outer-spin-button,.rwt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pct{flex:0 0 auto;font-size:9.5px;color:var(--c-text-3);width:8px}
.xbtn{flex:0 0 auto;width:16px;height:16px;border:0;background:transparent;color:var(--c-text-3);cursor:pointer;border-radius:2px;font-size:13px;opacity:0}
.lrow:hover .xbtn{opacity:1}
.xbtn:hover{background:var(--c-accent-soft);color:var(--c-sun)}
.addrow{height:var(--rowh);display:flex;align-items:center;gap:6px;padding:0 8px;width:100%;background:transparent;border:0;
  border-bottom:1px solid var(--c-line);color:var(--c-text-2);font-size:11.5px;cursor:pointer;text-align:left}
.addrow:hover{background:var(--c-accent-soft);color:var(--c-accent)}

.laxis{height:var(--curveh);position:relative;border-top:1px solid var(--c-line-strong);background:var(--c-paper-2)}
.laxis .cap{position:absolute;left:8px;top:6px;font-family:var(--f-disp);font-weight:700;font-size:11.5px;letter-spacing:.16em}
.laxis .tick{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-size:9.5px;color:var(--c-text-2)}
.laxis .lgd{position:absolute;left:8px;bottom:5px;display:flex;flex-direction:column;gap:2px;font-size:9px;color:var(--c-text-2)}
.laxis .lgd span{display:flex;align-items:center;gap:5px}

/* timeline layers */
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.tl-body,.tl-curve,.rowpad{position:relative;z-index:1}
.tl-head{height:calc(var(--h-month) + var(--h-day) + var(--h-dow));border-bottom:1px solid var(--c-line-strong);position:sticky}
.tl-head.caledit{cursor:pointer}
.mo{position:absolute;top:0;height:var(--h-month);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--c-line-strong);
  border-bottom:1px solid var(--c-line);background:var(--c-paper-2);font-family:var(--f-disp);font-weight:700;font-size:11.5px;letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.dn{position:absolute;top:var(--h-month);height:var(--h-day);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:9.5px;color:var(--c-text-2);white-space:nowrap}
.dw{position:absolute;top:calc(var(--h-month) + var(--h-day));height:var(--h-dow);display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--c-text-3);overflow:hidden}
.dn.sat,.dw.sat{color:var(--c-sat)}
.dn.off,.dw.off{color:var(--c-sun);font-weight:700}
.inspband{position:absolute;top:var(--h-month);height:calc(var(--h-day) + var(--h-dow));display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:.24em;color:var(--c-insp);white-space:nowrap;overflow:hidden;pointer-events:none}

.track{position:relative;height:var(--rowh);border-bottom:1px solid var(--c-line);cursor:crosshair}
.bar{position:absolute;z-index:2;cursor:grab;background:none}
.bar.plan{color:var(--c-bar);top:calc(var(--rowh) * 0.44 - 7px);height:14px}
.bar.act{color:var(--c-actual);top:calc(var(--rowh) * 0.89 - 7px);height:14px}
.bar .ln{position:absolute;left:0;right:0;top:6px;height:2px;background:currentColor}
.bar .ep{position:absolute;top:2.5px;width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;background:var(--c-paper);box-sizing:border-box}
.bar .ep.l{left:-3.5px}
.bar .ep.r{right:-3.5px}
.bar:hover .ln{height:3px;top:5.5px}
.bar.sel{outline:1.5px dashed var(--c-accent-2);outline-offset:2px;border-radius:2px}
.bar.ghost{opacity:.55;pointer-events:none}
.bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.bar .hd.l{left:-4px}
.bar .hd.r{right:-4px}
.btext{position:absolute;z-index:5;white-space:nowrap;cursor:move;line-height:1.15;padding:0 1px;border-radius:2px;font-family:var(--f-sheet)}
.btext.plan{top:calc(var(--rowh) * 0.04);font-size:var(--note-fs);color:var(--c-bar)}
.btext.act{top:calc(var(--rowh) * 0.57);font-size:var(--note-fs);color:var(--c-actual)}
.btext.ac{transform:translateX(-50%)}
.btext.ar{transform:translateX(-100%)}
.btext:hover{background:var(--c-accent-soft);outline:1px dotted var(--c-accent)}
.btext.sel{outline:1px dashed var(--c-accent-2);background:var(--c-accent-soft)}
.tick-mark{position:absolute;width:1px;z-index:3;background:currentColor;opacity:.45;pointer-events:none}
.bar-edit{position:absolute;z-index:9;height:18px;font-family:var(--f-sheet);border:1px solid var(--c-accent);background:var(--c-paper);
  color:var(--c-text);font-size:11px;padding:0 4px;border-radius:2px}
.rowpad{height:var(--rowh);border-bottom:1px solid var(--c-line)}
#bgSvg .pbars{display:none}

.tl-curve{height:var(--curveh);border-top:1px solid var(--c-line-strong)}
.tl-curve svg{display:block}

/* 月別出来高テーブル */
.mtab{position:relative;border-top:1px solid var(--c-line-strong);background:var(--c-paper)}
.lmtab{border-top:1px solid var(--c-line-strong);background:var(--c-paper-2)}
.mrow,.lmrow{height:var(--mrowh);position:relative;border-bottom:1px solid var(--c-line)}
.wtab,.lwtab{border-top:1px solid var(--c-line-strong);background:var(--c-field)}
.wrow,.lwrow{height:var(--mrowh);position:relative;border-bottom:1px solid var(--c-line)}
.wrow:last-child,.lwrow:last-child{border-bottom:0}
.lwrow{display:flex;align-items:center;padding:0 8px;gap:6px;font-size:10px;color:var(--c-text-2)}
.lwrow:first-child{font-size:9.5px;color:var(--c-text-3);letter-spacing:.04em}
.lwrow.p .tag{color:var(--c-plan);border:1px solid var(--c-plan);border-radius:2px;padding:0 4px;font-size:9px}
.lwrow.a .tag{color:var(--c-actual);border:1px solid var(--c-actual);border-radius:2px;padding:0 4px;font-size:9px}
.whead{height:var(--mrowh);position:relative;border-bottom:1px solid var(--c-line)}
.wcell{position:absolute;top:0;height:100%;border-right:1px solid var(--c-line-mid);overflow:hidden}
.wcell.h{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:9px;color:var(--c-text-3)}
.wi{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:9.5px;padding:0;-moz-appearance:textfield}
.wi::-webkit-outer-spin-button,.wi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wi.p{color:var(--c-plan)} .wi.a{color:var(--c-actual)}
.wi:focus{outline:0;background:var(--c-field-focus);box-shadow:inset 0 0 0 1px var(--c-accent)}
.wi::placeholder{color:var(--c-text-3);opacity:.5}
.mrow.mhead,.lmrow.h{height:var(--mheadh);background:var(--c-paper-2)}
.lmrow.h{font-size:9.5px;letter-spacing:.1em;color:var(--c-text-2);justify-content:flex-start}
.mcell.h{font-size:9px;color:var(--c-text-2)}
.mrow:last-child,.lmrow:last-child{border-bottom:0}
.lmrow{display:flex;align-items:center;padding:0 8px;font-size:10px;letter-spacing:.06em;color:var(--c-text-2);gap:6px}
.lmrow b{font-weight:700;color:var(--c-text)}
.lmrow .tag{font-family:var(--f-mono);font-size:9px;padding:0 4px;border:1px solid var(--c-line-mid);border-radius:2px}
.lmrow.a .tag{color:var(--c-actual);border-color:var(--c-actual)}
.lmrow.p .tag{color:var(--c-plan);border-color:var(--c-plan)}
.mcell{position:absolute;top:0;height:100%;border-right:1px solid var(--c-line-mid);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:9.5px;color:var(--c-text-2);overflow:hidden}
.mcell.p{color:var(--c-plan)}
.mcell.a{color:var(--c-actual)}
.mi{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:9.5px;color:var(--c-actual);
  padding:0;-moz-appearance:textfield}
.mi::-webkit-outer-spin-button,.mi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mi:focus{outline:0;background:var(--c-field-focus);box-shadow:inset 0 0 0 1px var(--c-accent)}
.mi::placeholder{color:var(--c-text-3);opacity:.6}

.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:10px;color:var(--c-text-3);font-family:var(--f-mono);letter-spacing:.04em}
.legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap}

(function(){
"use strict";
/* ============================================================ utils */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const MS=86400000, pad=n=>String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const p=String(s||'').split('-').map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); };
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diffDays=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/MS);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW=['日','月','火','水','木','金','土'];

/* ---------- 日本の祝日（1980-2099） ---------- */
const holidayCache={};
function nthMonday(y,m,n){ const d=new Date(y,m-1,1); return new Date(y,m-1,1+((8-d.getDay())%7)+(n-1)*7); }
function holidaysOf(y){
  if(holidayCache[y]) return holidayCache[y];
  const H={}, put=(d,n)=>{H[iso(d)]=n;};
  put(new Date(y,0,1),'元日'); put(nthMonday(y,1,2),'成人の日');
  put(new Date(y,1,11),'建国記念の日'); if(y>=2020) put(new Date(y,1,23),'天皇誕生日');
  put(new Date(y,2,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))),'春分の日');
  put(new Date(y,3,29), y>=2007?'昭和の日':'みどりの日');
  put(new Date(y,4,3),'憲法記念日'); put(new Date(y,4,4), y>=2007?'みどりの日':'国民の休日'); put(new Date(y,4,5),'こどもの日');
  put(y>=2003?nthMonday(y,7,3):new Date(y,6,20),'海の日');
  if(y>=2016) put(new Date(y,7,11),'山の日');
  put(nthMonday(y,9,3),'敬老の日');
  put(new Date(y,8,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4))),'秋分の日');
  put(nthMonday(y,10,2), y>=2020?'スポーツの日':'体育の日');
  put(new Date(y,10,3),'文化の日'); put(new Date(y,10,23),'勤労感謝の日');
  if(y<2019) put(new Date(y,11,23),'天皇誕生日');
  Object.keys(H).slice().forEach(k=>{ const d=parse(k),d1=addDays(d,1),d2=addDays(d,2);
    if(H[iso(d2)] && !H[iso(d1)] && d1.getDay()!==0) H[iso(d1)]='国民の休日'; });
  Object.keys(H).slice().forEach(k=>{ const d=parse(k);
    if(d.getDay()===0){ let n=addDays(d,1); while(H[iso(n)]) n=addDays(n,1); H[iso(n)]='振替休日'; } });
  holidayCache[y]=H; return H;
}

function ruleOff(d){
  const w=d.getDay();
  if(w===0) return true;
  if(state.cal.base==='satsun' && w===6) return true;
  if(state.cal.base==='biweekly' && w===6){ const nth=Math.floor((d.getDate()-1)/7)+1; if(nth===2||nth===4) return true; }
  if(state.cal.jp && holidayName(d)) return true;
  return false;
}
function isOff(d){
  const k=iso(d);
  if(state.cal.work[k]) return false;
  if(state.cal.off[k]) return true;
  return ruleOff(d);
}
function toggleDay(k){
  const d=parse(k);
  if(state.cal.work[k]) delete state.cal.work[k];
  else if(state.cal.off[k]) delete state.cal.off[k];
  else if(ruleOff(d)) state.cal.work[k]=1;
  else state.cal.off[k]=1;
}

function buildDays(){
  const S=parse(state.meta.start), n=totalDays(), we=workEndIdx();
  days=[];
  for(let i=0;i<n;i++){
    const d=addDays(S,i), k=iso(d), w=d.getDay(), hn=holidayName(d), off=isOff(d);
    const tone = off ? 'sun' : '';
    days.push({i,d,iso:k,dow:w,tone,off,hol:hn,inspect:i>we});
  }
  segs=[]; let i=0;
  while(i<days.length){
    let j=i;
    while(j+1<days.length && days[j+1].d.getMonth()===days[i].d.getMonth() && days[j+1].d.getFullYear()===days[i].d.getFullYear()) j++;
    const dt=days[i].d;
    segs.push({i0:i,i1:j,key:dt.getFullYear()+'-'+pad(dt.getMonth()+1),y:dt.getFullYear(),m:dt.getMonth()+1});
    i=j+1;
  }
}
function mondayOf(d){ const w=(d.getDay()+6)%7; return addDays(d,-w); }
function periods(){
  if(state.opts.unit==='month') return segs.map(g=>({i0:g.i0,i1:g.i1,key:g.key,label:g.m+'月'}));
  const out=[]; let cur=null;
  days.forEach(d=>{
    const k='W'+iso(mondayOf(d.d));
    if(!cur||cur.key!==k){ cur={i0:d.i,i1:d.i,key:k,label:(d.d.getMonth()+1)+'/'+d.d.getDate()}; out.push(cur); }
    else cur.i1=d.i;
  });
  return out;
}

const dateOf = i => iso(addDays(parse(state.meta.start), i));
const W = () => days.length*state.opts.cw;

/* ---------- Sカーブ ---------- */
function computeCurve(){
  const n=days.length, daily=new Array(n).fill(0);
  const total=state.rows.reduce((s,r)=>s+(Number(r.weight)||0),0);
  if(total>0){
    const shape = state.opts.shape==='s' ? (x=>x*x*(3-2*x)) : (x=>x);
    state.rows.forEach(r=>{
      const w=(Number(r.weight)||0)/total;
      if(!w||!r.tasks.length) return;
      const segsL=r.tasks.map(t=>{
        let a=clamp(idxOf(t.s),0,n-1), b=clamp(idxOf(t.e),0,n-1);
        if(b<a){const x=a;a=b;b=x;}
        const list=[];
        for(let i=a;i<=b;i++) if(!state.opts.workday || !days[i].off) list.push(i);
        if(!list.length) for(let i=a;i<=b;i++) list.push(i);
        return list;
      });
      const grand=segsL.reduce((s,l)=>s+l.length,0)||1;
      segsL.forEach(list=>{
        const share=w*(list.length/grand), m=list.length;
        list.forEach((di,k)=>{ daily[di]+=share*(shape((k+1)/m)-shape(k/m)); });
      });
    });
  }
  const cum=new Array(n).fill(0); let acc=0;
  for(let i=0;i<n;i++){ acc+=daily[i]; cum[i]=acc*100; }
  return cum;
}

function textW(str,fs){ let w=0; for(const ch of String(str||'')) w += (ch.charCodeAt(0)>0x2E7F?1:0.56); return w*fs; }
function noteFS(){ return (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--note-fs'))||9); }
/* 端で切れないように寄せ方を自動調整 */
function effAlign(x,txt,align,fs){
  const w=textW(txt,fs), tot=W();
  let al=align||'center';
  if(al==='left' && x+w>tot-2) al='right';
  if(al==='center'){ if(x-w/2<2) al='left'; else if(x+w/2>tot-2) al='right'; }
  if(al==='right' && x-w<2) al='left';
  return al;
}

function weekPoints(){
  const cum=computeCurve(), der=derivedWeekly();
  return periods().map((g,k)=>{
    const auto=cum[g.i1]||0;
    const d=der?der.map[g.key]:null;
    const dp=(d&&der.anyP)?d.plan:null;
    const da=(d&&der.lastA>=0&&k<=der.lastA)?d.act:null;
    const pv=state.wplan[g.key], av=state.wact[g.key];
    return {i:g.i1, i0:g.i0, key:g.key, label:g.label, auto:(dp!=null?dp:auto),
      plan:(pv!=null&&pv!=='')?Number(pv):(dp!=null?dp:auto),
      act:(av!=null&&av!=='')?Number(av):da};
  });
}
/* 指定日における折れ線の値（線形補間） */
function valueAt(pts,dayIdx,field){
  const list=pts.filter(p=>p[field]!=null);
  if(!list.length) return null;
  if(dayIdx<list[0].i) return (field==='plan')? interp(0,-1,list[0].i,list[0][field],dayIdx) : null;
  if(dayIdx>list[list.length-1].i && field!=='plan') return null;
  let prev=list[0];
  for(const p of list){
    if(p.i===dayIdx) return p[field];
    if(p.i>dayIdx) return interp(prev[field],prev.i,p.i,p[field],dayIdx);
    prev=p;
  }
  return prev[field];
}
function interp(v0,i0,i1,v1,x){ if(i1===i0) return v1; return v0+(v1-v0)*((x-i0)/(i1-i0)); }
function renderCurve(){

  }

  });

/* 印刷用の工程バーをSVGで生成（背景色OFFでも出る／計算値のみでレイアウトに依存しない） */
function renderPrintBars(){
  const svg=$('#bgSvg'); if(!svg) return;
  const cs=getComputedStyle(document.documentElement), gv=n=>parseFloat(cs.getPropertyValue(n))||0;
  const cw=state.opts.cw, rowh=gv('--rowh'), fs=noteFS();
  const fam=(cs.getPropertyValue('--f-sheet')||'sans-serif').trim().replace(/"/g,'&quot;');
  let s='';
  const rowIndex={}; state.rows.forEach((r,i)=>rowIndex[r.id]=i);
  state.rows.forEach((r,ri)=>{
    const top=ri*rowh;
    const draw=(t,kind)=>{
      let a=idxOf(t.s), b=idxOf(t.e); if(b<a){const x=a;a=b;b=x;}
      if(b<0||a>days.length-1) return;
      const x=a*cw, w=Math.max(3,(b-a+1)*cw);
      const col=(kind==='plan')?'var(--c-bar)':'var(--c-actual)';
      const cy=top+rowh*((kind==='plan')?0.44:0.89);
      s+='<rect x="'+x.toFixed(1)+'" y="'+(cy-1).toFixed(1)+'" width="'+w.toFixed(1)+'" height="2" fill="'+col+'"/>';
      s+='<circle cx="'+x.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="var(--c-paper)" stroke="'+col+'" stroke-width="1.4"/>';
      s+='<circle cx="'+(x+w).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="var(--c-paper)" stroke="'+col+'" stroke-width="1.4"/>';
    };
    r.tasks.forEach(t=>draw(t,'plan'));
    (r.acts||[]).forEach(t=>draw(t,'act'));
  });
  state.texts.forEach(tx=>{
    const ri=rowIndex[tx.row]; if(ri===undefined||!tx.text) return;
    const top=ri*rowh;
    const x=clamp(idxOf(tx.at),0,days.length-1)*cw+cw/2;
    const al=effAlign(x,tx.text,tx.align,fs);
    const anc=(al==='left')?'start':(al==='right'?'end':'middle');
    const col=(tx.band==='act')?'var(--c-actual)':'var(--c-bar)';
    const y=top+rowh*((tx.band==='act')?0.72:0.20)+fs;
    s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anc+'" font-size="'+fs+'" fill="'+col+'" font-family="'+fam+'">'+esc(tx.text)+'</text>';
  });
  const old=svg.querySelector('.pbars'); if(old) old.remove();
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','pbars'); g.innerHTML=s; svg.appendChild(g);
}

/* ============================================================ バー操作 */
const layerOf = (r,kind) => kind==='act' ? (r.acts||(r.acts=[])) : r.tasks;
/* 同じ段の既存の線に重ならない範囲（anchor を含む空き区間） */
function freeWindow(row,kind,except,anchor){
  const arr = kind==='act' ? (row.acts||[]) : row.tasks;
  let lo=0, hi=days.length-1, blocked=false;
  arr.forEach(x=>{
    if(x===except) return;
    let a=idxOf(x.s), b=idxOf(x.e); if(b<a){const t=a;a=b;b=t;}
    if(anchor>=a&&anchor<=b){ blocked=true; return; }
    if(b<anchor) lo=Math.max(lo,b+1);
    if(a>anchor) hi=Math.min(hi,a-1);
  });
  return {lo,hi,blocked};
}
function dayFromEvent(e,node){ const r=node.getBoundingClientRect(); return clamp(Math.floor((e.clientX-r.left)/state.opts.cw),0,days.length-1); }
const rowById = id => state.rows.find(r=>r.id===id);

function onTrackDown(e){
  const track=e.target.closest('.track'); if(!track) return;
  const row=rowById(track.dataset.row); if(!row) return;
  const textNode=e.target.closest('.btext');
  const barNode=e.target.closest('.bar');
  e.preventDefault();
  if(textNode){
    const tx=state.texts.find(o=>o.id===textNode.dataset.text); if(!tx) return;
    selectText(tx);
    dragging={mode:'text',tx:tx,node:textNode,track,grab:dayFromEvent(e,track),y0:e.clientY};
    return;
  }
  if(barNode){
    const kind=barNode.dataset.kind;
    const arr = kind==='act' ? (row.acts||[]) : row.tasks;
    const t=arr.find(x=>x.id===barNode.dataset.task); if(!t) return;
    select(row,t,kind);
    const hd=e.target.closest('.hd');
    dragging={mode:hd?(hd.classList.contains('l')?'resizeL':'resizeR'):'move',row,t,node:barNode,track,kind:kind,
      grab:dayFromEvent(e,track),s0:idxOf(t.s),e0:idxOf(t.e),x0:e.clientX};
    barNode.style.cursor = dragging.mode==='move'?'grabbing':'ew-resize';
  }else{
    const d=dayFromEvent(e,track);
    const tr=track.getBoundingClientRect();
    const kind = ((e.clientY-tr.top)/tr.height) < 0.66 ? 'plan' : 'act';
    const fw=freeWindow(row,kind,null,d);
    if(fw.blocked){ toast('すでに線があります。既存の線をドラッグして調整してください'); return; }
    const t={id:uid(),s:dateOf(d),e:dateOf(d),notes:[]};
    layerOf(row,kind).push(t);
    const node=barEl(row,t,kind); if(!node) return; node.classList.add('ghost'); track.appendChild(node);
    select(row,t,kind);
    dragging={mode:'create',row,t,node,track,grab:d,s0:d,e0:d,kind:kind,win:fw,x0:e.clientX};
  }
}
function onDragMove(e){
  if(rowDrag){ moveRowDrag(e); return; }
  if(!dragging) return;
  const d=dayFromEvent(e,dragging.track), t=dragging.t, n=days.length-1;
  dragging.lastX=e.clientX;
  if(dragging.lastD===undefined) dragging.lastD=dragging.grab;
  if(d!==dragging.lastD){ dragging.moved=true; dragging.lastD=d; }
  if(dragging.mode==='text'){
    const tx=dragging.tx;
    tx.at=dateOf(clamp(d,0,days.length-1));
    const tr=dragging.track.getBoundingClientRect();
    tx.band=((e.clientY-tr.top)/tr.height)<0.55?'plan':'act';
    dragging.node.style.left=(clamp(d,0,days.length-1)*state.opts.cw+state.opts.cw/2)+'px';
    dragging.node.classList.toggle('act',tx.band==='act');
    dragging.node.classList.toggle('plan',tx.band!=='act');
    return;
  }
  const kind=dragging.kind||'plan';
  if(dragging.mode==='create'){
    const w=dragging.win;
    const a=clamp(Math.min(dragging.s0,d),w.lo,w.hi), b=clamp(Math.max(dragging.s0,d),w.lo,w.hi);
    t.s=dateOf(a); t.e=dateOf(b);
  }
  else if(dragging.mode==='move'){
    const len=dragging.e0-dragging.s0;
    const ns=clamp(dragging.s0+(d-dragging.grab),0,n-len);
    const w=freeWindow(dragging.row,kind,t,ns);
    if(!w.blocked && ns>=w.lo && ns+len<=w.hi){ t.s=dateOf(ns); t.e=dateOf(ns+len); }
  }
  else if(dragging.mode==='resizeL'){
    const w=freeWindow(dragging.row,kind,t,dragging.e0);
    const s2=clamp(Math.min(d,dragging.e0),w.lo,dragging.e0);
    t.s=dateOf(s2); t.e=dateOf(dragging.e0);
  }
  else {
    const w=freeWindow(dragging.row,kind,t,dragging.s0);
    const en=clamp(Math.max(d,dragging.s0),dragging.s0,w.hi);
    t.s=dateOf(dragging.s0); t.e=dateOf(en);
  }
  const a=idxOf(t.s), b=idxOf(t.e), cw=state.opts.cw;
  dragging.node.style.left=(a*cw)+'px';
  dragging.node.style.width=Math.max(3,(b-a+1)*cw)+'px';
  renderCurve(); syncInspector();
}
function onDragEnd(){
  if(rowDrag){ endRowDrag(); return; }
  if(!dragging) return;
  const d=dragging; dragging=null;
  d.node.classList.remove('ghost'); d.node.style.cursor='';
  if(d.mode==='text'){ render(); save(); return; }
  if(d.mode==='create'){
    const moved=Math.abs((d.lastX||d.x0)-d.x0)>=5 || d.moved;
    if(!moved){ const arr=layerOf(d.row,d.kind); const i=arr.indexOf(d.t); if(i>=0) arr.splice(i,1); d.node.remove(); sel=null; syncInspector(); return; }
    render(); save(); return;
  }
  if(!d.moved) return;   /* 動いていない＝ただのクリック。DOMを保持してダブルクリックを効かせる */
  render(); save();
}
/* マウスに加えてタッチ・ペンでも同じ操作ができるようにする（pointerdown を止めると互換マウスイベントは発生しない） */
const notMouse = fn => e => { if(e.pointerType!=='mouse') fn(e); };
$('#tlBody').addEventListener('mousedown',onTrackDown);
$('#tlBody').addEventListener('pointerdown',notMouse(onTrackDown));
window.addEventListener('mousemove',onDragMove);
window.addEventListener('pointermove',notMouse(onDragMove));
window.addEventListener('mouseup',onDragEnd);
window.addEventListener('pointerup',notMouse(onDragEnd));
window.addEventListener('pointercancel',notMouse(onDragEnd));
function addTextAt(row,dayIdx,band){
  const tx={id:uid(),row:row.id,at:dateOf(clamp(dayIdx,0,days.length-1)),band:band||'plan',text:'',align:'center'};
  state.texts.push(tx);
  render(); openTextEditor(tx);
  return tx;
}
function openTextEditor(tx){
  const node=document.querySelector('.btext[data-text="'+tx.id+'"]'); if(!node) return;
  const holder=node.parentNode;
  const inp=el('input','bar-edit'); inp.type='text'; inp.value=tx.text||'';
  inp.style.left=node.style.left;
  inp.style.top='calc(var(--rowh) * '+(tx.band==='act'?'0.55':'0.02')+')';
  inp.style.width='180px';
  inp.style.transform='translateX(-50%)';
  holder.appendChild(inp); inp.focus(); inp.select();
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    tx.text=inp.value.trim();
    if(!tx.text){ const i=state.texts.indexOf(tx); if(i>=0) state.texts.splice(i,1); selText=null; }
    inp.remove(); render(); save();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); }
    if(ev.key==='Escape'){ inp.value=tx.text||''; inp.blur(); }
  });
}
$('#tlBody').addEventListener('dblclick',e=>{
  const tn=e.target.closest('.btext');
  if(tn){ const tx=state.texts.find(o=>o.id===tn.dataset.text); if(tx) openTextEditor(tx); return; }
  const track=e.target.closest('.track'); if(!track) return;
  const row=rowById(track.dataset.row); if(!row) return;
  const tr=track.getBoundingClientRect();
  addTextAt(row, dayFromEvent(e,track), ((e.clientY-tr.top)/tr.height)<0.55?'plan':'act');
});

window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='Escape'){ closeModal(); deselect(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }

  if(e.key==='Delete'||e.key==='Backspace'){
    if(selText){ e.preventDefault(); const i=state.texts.indexOf(selText); if(i>=0) state.texts.splice(i,1); selText=null; render(); save(); return; }
    if(sel){ e.preventDefault(); const arr=selArr(),i=arr.indexOf(sel.t); if(i>=0) arr.splice(i,1); sel=null; render(); save(); }
  }
});

/* ---------- 行の並び替え ---------- */
function startRowDrag(e,index){ e.preventDefault(); rowDrag={from:index,to:index}; document.querySelectorAll('.lrow')[index].classList.add('drag'); }
function moveRowDrag(e){
  const rows=document.querySelectorAll('.lrow'); if(!rows.length) return;
  const first=rows[0].getBoundingClientRect(), h=first.height||30;
  const to=clamp(Math.floor((e.clientY-first.top)/h),0,rows.length-1);
  rowDrag.to=to;
  rows.forEach((n,i)=> n.style.boxShadow=(i===to&&to!==rowDrag.from)?'inset 0 2px 0 var(--c-accent)':'');
}
function endRowDrag(){

function workDaysOf(i0,i1){ let n=0; for(let i=Math.max(0,i0);i<=Math.min(days.length-1,i1);i++){ const d=days[i]; if(d && !d.off && !d.inspect) n++; } return n; }
function totalWorkDays(){ return workDaysOf(0,days.length-1); }
const AUTO_RE=/共通仮設費|現場管理費|一般管理費|諸経費|現場経費/;
function markAutoItems(list){ list.forEach(it=>{ if(AUTO_RE.test(it.g||'')||AUTO_RE.test(it.n||'')) it.auto='days'; }); return list; }
function itemTotalR(){ return state.items.reduce((s,i)=>s+(Number(i.r)||0),0)||1; }
function itemPlannedSum(it){
  const store=state.iplan[it.id]||{}; let s=0;
  Object.keys(store).forEach(k=>{ const v=Number(store[k]); if(!isNaN(v)) s+=v; });
  return s;
}
function fmtQty(v){ if(!isFinite(v)) return '0'; const r=Math.round(v*1000)/1000; return String(r); }
function residCellHTML(it){
  if(it.auto==='days') return '<span class="autoq">—</span>';
  const resid=(Number(it.q)||0)-itemPlannedSum(it);
  return '<span'+(resid<0?' style="color:var(--c-actual)"':'')+'>'+fmtQty(resid)+'</span>';
}
function derivedWeekly(){
  if(!state.items.length) return null;
  const ps=periods(), totR=itemTotalR(), totW=totalWorkDays()||1;
  const manual=state.items.filter(i=>i.auto!=='days');
  const autos=state.items.filter(i=>i.auto==='days');
  let lastA=-1, anyP=false;
  ps.forEach((g,k)=>{
    manual.forEach(it=>{
      if(Number((state.iplan[it.id]||{})[g.key])>0) anyP=true;
      if(Number((state.iact[it.id]||{})[g.key])>0) lastA=k;
    });
  });
  let cp=0, ca=0;
  const out={};
  ps.forEach((g,k)=>{
    const wd=workDaysOf(g.i0,g.i1);
    let dp=0, da=0;
    manual.forEach(it=>{
      const q=Number(it.q)||0; if(!q) return;
      const r=(Number(it.r)||0)/totR*100;
      const p=Number((state.iplan[it.id]||{})[g.key])||0;
      const ac=Number((state.iact[it.id]||{})[g.key])||0;
      if(p) dp+=p/q*r;
      if(ac) da+=ac/q*r;
    });
    if(anyP||autos.length){
      autos.forEach(it=>{
        const r=(Number(it.r)||0)/totR*100;
        dp += wd/totW*r;
        if(k<=lastA) da += wd/totW*r;
      });
    }
    cp+=dp; ca+=da;
    out[g.key]={plan:cp,act:ca,dp:dp,da:da,idx:k,wd:wd};
  });
  return {map:out,anyP:anyP,lastA:lastA,totW:totW};
}

/* 明細（工種・数量）から工種行と工程線を組み立てる。数量が入るたびに自動で呼ばれる。 */
function applyItemsToRows(){
  if(!state.items.length) return;
  const totR=itemTotalR(), g={};
  state.items.forEach(it=>{ g[it.g]=(g[it.g]||0)+(Number(it.r)||0); });
  const keep={}; state.rows.forEach(r=>keep[r.name]=r);
  state.rows=Object.keys(g).map(name=>{
    const old=keep[name];
    return { id: old?old.id:uid(), name:name, weight:Math.round(g[name]/totR*1000)/10,
             tasks: old?old.tasks:[], acts: old?old.acts:[] };
  });
}
function autoBarsFromItems(){
  const ps=periods();
  state.rows.forEach(r=>{
    const its=state.items.filter(i=>i.g===r.name);
    const allAuto=its.length&&its.every(i=>i.auto==='days');
    const der0=derivedWeekly();
    const mk=(store,isAct)=>{
      if(allAuto){
        if(isAct){ if(!der0||der0.lastA<0) return []; return [{id:uid(),s:dateOf(ps[0].i0),e:dateOf(ps[der0.lastA].i1)}]; }
        return [{id:uid(),s:dateOf(0),e:dateOf(workEndIdx())}];
      }
      const on=ps.map(g=> its.some(i=> Number((store[i.id]||{})[g.key])>0 ));
      const bars=[]; let st=-1;
      on.forEach((v,k)=>{
        if(v && st<0) st=k;
        if((!v||k===on.length-1) && st>=0){
          const en=(v&&k===on.length-1)?k:k-1;
          bars.push({id:uid(), s:dateOf(ps[st].i0), e:dateOf(ps[en].i1)});
          st=-1;
        }
      });
      return bars;
    };
    r.tasks=mk(state.iplan,false); r.acts=mk(state.iact,true);
  });
}
/* 工程管理表の内容（工種・数量・週の入力）から工程表の工種行・比率・予定線／実績線を自動で作り直す */
function syncFromItems(){
  if(!state.items.length) return;
  applyItemsToRows();
  autoBarsFromItems();
  sel=null; selText=null; render(); save();
}
/* ============================================================ 印刷 */
const pageStyle=document.createElement('style');
(document.head||document.body).appendChild(pageStyle);
function setPageCSS(){ pageStyle.textContent='@page{ size:'+(state.opts.paper==='A4'?'A4':'A3')+' landscape; margin:8mm; }'; }
const PAPER={A3:{w:420,h:297},A4:{w:297,h:210}};
const ZOOM_OK=!!(window.CSS&&CSS.supports&&CSS.supports('zoom','0.5'));
const BASE_ROWH=36, BASE_CURVEH=150, MAX_ROWH=44;
let printed=false, screenCw=null;
function measureSheet(){
  const sheet=$('#sheet');
  document.body.classList.add('measuring');
  const w=Math.max(sheet.scrollWidth,sheet.getBoundingClientRect().width), h=sheet.scrollHeight;
  document.body.classList.remove('measuring');
  return {w,h};
}
function setGeom(rowh,curveh){
  document.documentElement.style.setProperty('--rowh',rowh+'px');
  document.documentElement.style.setProperty('--curveh',curveh+'px');
  renderCurve(); renderPrintBars();
}
function preparePrint(){
  const sheet=$('#sheet'), wrap=$('#printWrap');
  sheet.style.transform='none'; sheet.style.zoom=''; wrap.style.width=''; wrap.style.height='';
  if(screenCw==null) screenCw=state.opts.cw;
  const P=PAPER[state.opts.paper]||PAPER.A3, mm=96/25.4, margin=8;
  const availW=(P.w-margin*2)*mm, availH=(P.h-margin*2)*mm;
  const leftw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--leftw'))||252;
  // 用紙幅ぴったりの列幅にする
  state.opts.cw=Math.round(clamp((availW-leftw-2)/Math.max(1,days.length),0.9,44)*100)/100;
  setGeom(BASE_ROWH,BASE_CURVEH); render();
  sheet.style.width=Math.ceil(leftw+W()+2)+'px';
  // 高さは行高・曲線高そのものを調整して用紙に合わせる（縮小変換に頼らない＝改ページが起きない）
  setGeom(BASE_ROWH,BASE_CURVEH);
  let m=measureSheet(), rowh=BASE_ROWH, curveh=BASE_CURVEH;
  const nrow=Math.max(1,state.rows.length);
  if(m.h>availH){
    for(let it=0; it<18 && m.h>availH; it++){
      const over=m.h-availH;
      rowh=Math.max(26, rowh-Math.max(1,Math.ceil(over/(nrow+3))));
      curveh=Math.max(80, curveh-Math.max(1,Math.ceil(over*0.3)));
      setGeom(rowh,curveh); m=measureSheet();
      if(rowh<=26 && curveh<=80) break;
    }
  }else if(m.h<availH-12){
    const slack=availH-m.h;
    const addRow=clamp(Math.floor(slack*0.55/nrow),0,MAX_ROWH-BASE_ROWH);
    const rest=Math.max(0,slack-addRow*nrow);
    setGeom(BASE_ROWH+addRow, Math.round(clamp(BASE_CURVEH+rest*0.85,BASE_CURVEH,availH*0.40)));
    m=measureSheet();
  }
  const natW=leftw+W()+2;
  const k=Math.min(availW/natW,availH/m.h,1)*0.995;
  // zoom はレイアウト自体を縮めるため、印刷時に改ページが起きない（未対応環境は transform）
  if(ZOOM_OK){ sheet.style.zoom=k.toFixed(5); wrap.style.width=''; wrap.style.height=''; }
  else{
    sheet.style.transformOrigin='top left';
    sheet.style.transform='scale('+k.toFixed(5)+')';
    wrap.style.width=Math.floor(natW*k)+'px';
    wrap.style.height=Math.floor(m.h*k)+'px';
  }
  try{ window.__lastPrint={mw:natW,mh:m.h,k:k,availW:availW,availH:availH,cw:state.opts.cw,
    media:(window.matchMedia&&window.matchMedia('print').matches)?'print':'screen'}; }catch(e){}
  printed=true;
}
function restorePrint(){
  const sheet=$('#sheet'), wrap=$('#printWrap');
  sheet.style.transform=''; sheet.style.transformOrigin=''; sheet.style.width=''; sheet.style.zoom='';
  wrap.style.width='100%'; wrap.style.height='';
  if(screenCw!=null){ state.opts.cw=screenCw; screenCw=null; }
  setGeom(BASE_ROWH,BASE_CURVEH); render(); applyScreenZoom(); printed=false;
}
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('afterprint',()=>{ setTimeout(restorePrint,80); });
$('#btnPrint').addEventListener('click',()=>{
  deselect(); preparePrint();
  setTimeout(()=>{ window.print(); setTimeout(()=>{ if(printed) restorePrint(); },400); },60);
});

/* ============================================================ 保存 */
const KEY='koutei-builder-v5';
let saveTimer=null, undoStack=[], redoStack=[], lastSnap=null, lastPush=0;
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function snapshot(){ return JSON.stringify({meta:state.meta,cal:state.cal,rows:state.rows,actual:state.actual,wplan:state.wplan,wact:state.wact,texts:state.texts,items:state.items,iplan:state.iplan,iact:state.iact}); }
function applySnapshot(js){
  let o; try{ o=JSON.parse(js); }catch(e){ return; }
  Object.assign(state.meta,o.meta||{});
  if(o.cal) state.cal=o.cal;
  state.rows=o.rows||[]; state.actual=o.actual||{}; state.wplan=o.wplan||{}; state.wact=o.wact||{}; state.texts=o.texts||[];
  state.items=o.items||[]; state.iplan=o.iplan||{}; state.iact=o.iact||{};
  sel=null; selText=null; applyMeta(); render(); renderKanri(); persist();
}
function save(){
  const cur=snapshot();
  if(lastSnap!==null && cur!==lastSnap){
    const now=Date.now();
    if(now-lastPush>300 || !undoStack.length){
      undoStack.push(lastSnap);
      if(undoStack.length>120) undoStack.shift();
      redoStack.length=0; lastPush=now;
    }
  }
  lastSnap=cur;
  clearTimeout(saveTimer); saveTimer=setTimeout(persist,300);
  updateUndoBtn();
}
function updateUndoBtn(){
  [['#btnUndo','#kUndo',undoStack],['#btnRedo','#kRedo',redoStack]].forEach(([a,b,st])=>{
    [a,b].forEach(q=>{ const n=$(q); if(n) n.disabled=!st.length; });
  });
}
function undo(){
  if(!undoStack.length){ toast('これ以上は戻せません'); return; }
  redoStack.push(snapshot());
  const prev=undoStack.pop(); lastSnap=prev; applySnapshot(prev); updateUndoBtn();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  const nx=redoStack.pop(); lastSnap=nx; applySnapshot(nx); updateUndoBtn();
}
function load(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem('koutei-builder-v4'); if(!raw) return false;
    const o=JSON.parse(raw); if(!o||!o.rows||!o.rows.length) return false;
    Object.assign(state.meta,o.meta||{}); Object.assign(state.opts,o.opts||{});
    if(o.cal) Object.assign(state.cal,o.cal);
    state.rows=o.rows.map(r=>({acts:[],...r}));
    state.actual=o.actual||{}; state.wplan=o.wplan||{}; state.wact=o.wact||{}; state.texts=o.texts||[];
    state.items=o.items||[]; state.iplan=o.iplan||{}; state.iact=o.iact||{};
    migrateNotes();
    forceFixedOpts();
    return true;
  }catch(e){ return false; }
}

/* ---------- 休日設定 ---------- */
function parseJPDate(line){
  const t=String(line).trim(); if(!t) return null;
  let m=t.match(/^(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})/);
  if(!m) return null;
  const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  return isNaN(d)?null:iso(d);
}

function openDataModal(){
  openModal(
    '<h2>データの保存・読込</h2>'+
    '<p>下のテキストをコピーして保管すれば、いつでもこの工程表を復元できます。貼り付けて「読込」で復元します。編集内容はこのブラウザに自動保存されています。</p>'+
    '<textarea id="dataArea" spellcheck="false" style="height:210px"></textarea>'+
    '<div class="row">'+
      '<button class="mini" id="dCopy">コピー</button><button class="mini" id="dLoad">読込</button>'+
      '<button class="mini" id="dFile">ファイルに保存</button>'+
      '<label class="mini" style="text-align:center;cursor:pointer">ファイルから読込<input type="file" id="dOpen" accept="application/json,.json" style="display:none"></label>'+
      '<button class="mini danger" id="dReset">全消去してやり直す</button><button class="mini" id="dClose">閉じる</button>'+
    '</div>');
  $('#dataArea').value=JSON.stringify(state,null,1);
  $('#dCopy').onclick=()=>{ const a=$('#dataArea'); a.select();
    (navigator.clipboard?navigator.clipboard.writeText(a.value):Promise.reject()).then(()=>toast('コピーしました'),
      ()=>{ try{document.execCommand('copy');toast('コピーしました');}catch(e){toast('手動でコピーしてください');} }); };
  $('#dLoad').onclick=()=>{ try{
      const o=JSON.parse($('#dataArea').value); if(!o.rows) throw 0;
      Object.assign(state.meta,o.meta||{}); Object.assign(state.opts,o.opts||{});
      if(o.cal) Object.assign(state.cal,o.cal);
      state.rows=o.rows.map(r=>({acts:[],...r})); state.actual=o.actual||{};
      state.wplan=o.wplan||{}; state.wact=o.wact||{}; state.texts=o.texts||[];
      state.items=o.items||[]; state.iplan=o.iplan||{}; state.iact=o.iact||{};
      migrateNotes(); forceFixedOpts(); applyMeta(); syncToggles(); setPageCSS(); applyFont(); sel=null; selText=null;
      setView(state.opts.view||'chart'); save(); closeModal(); toast('読み込みました');
    }catch(e){ toast('データの形式が正しくありません'); } };
  $('#dFile').onclick=()=>{ try{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));
      a.download=(state.meta.name||'工程表')+'.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      toast('ダウンロードが始まらない場合は、上のテキストをコピーして保存してください');
    }catch(e){ toast('この環境では保存できません。上のテキストをコピーしてください'); } };
  $('#dOpen').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ $('#dataArea').value=rd.result; $('#dLoad').click(); }; rd.readAsText(f); };
  $('#dReset').onclick=()=>{ if(!confirm('すべての入力を消去して初期状態に戻します。よろしいですか？')) return;
    try{localStorage.removeItem(KEY);}catch(e){}
    state.actual={}; state.wplan={}; state.wact={}; state.texts=[]; state.meta.name=state.meta.owner='';
    state.items=[]; state.iplan={}; state.iact={};
    state.cal.off={}; CAL2026.forEach(k=>state.cal.off[k]=1); state.cal.work={};
    seed(); applyMeta(); sel=null; selText=null; setView(state.opts.view||'chart'); save(); closeModal(); toast('初期化しました'); };
  $('#dClose').onclick=closeModal;
}
